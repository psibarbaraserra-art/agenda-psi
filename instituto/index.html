<!doctype html>
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Instituto Luma · Gestão</title>
<meta name="description" content="Gestão administrativa do Instituto Luma – Luz para mães atípicas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luma Gestão">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0b0b0c;
  --surface: #151515;
  --surface-2: #1d1c1a;
  --line: #2f2b22;
  --ink: #f4efe4;
  --muted: #aaa293;
  --gold: #d6b04c;
  --gold-2: #f0d27a;
  --gold-deep: #9c7a26;
  --on-gold: #141109;
  --ok: #7ccf9a; --ok-bg: #16281d;
  --warn: #f0c060; --warn-bg: #2e2412;
  --bad: #ff8a80; --bad-bg: #331917;
  --info: #8cc8ff; --info-bg: #142231;
  --shadow: 0 12px 34px rgba(0, 0, 0, .45);
  --rainbow: linear-gradient(90deg, #e53935, #fb8c00, #fdd835, #43a047, #1e88e5, #5e35b1, #8e24aa);
  --font-script: "Great Vibes", "Brush Script MT", cursive;
  --font-body: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-theme="claro"] {
  --bg: #f7f3ea; --surface: #fffdf8; --surface-2: #f1ebdd; --line: #e2d7bf;
  --ink: #1b1812; --muted: #6f6656; --gold: #9c7a26; --gold-2: #7d5f16; --gold-deep: #c9a443; --on-gold: #fffdf8;
  --ok: #2e7d4f; --ok-bg: #e3f2e8; --warn: #8a5a00; --warn-bg: #fbefd2; --bad: #b3261e; --bad-bg: #fbe3e1; --info: #1f5f99; --info-bg: #e2eef9;
  --shadow: 0 10px 28px rgba(80, 60, 10, .12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); min-height: 100vh; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
a { color: var(--gold-2); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.2; margin: 0; }

/* ---------- topo ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0); }
.top::after { content: ""; display: block; height: 3px; background: var(--rainbow); opacity: .9; }
.top-in { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
.brand img { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--gold); background: #fff; flex: none; }
.brand-txt { display: flex; flex-direction: column; min-width: 0; }
.brand-k { font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: var(--ink); font-weight: 600; }
.brand-n { font-family: var(--font-script); font-size: 34px; line-height: .9; color: var(--gold-2); margin-top: 2px; }
.brand-s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-act { margin-left: auto; display: flex; gap: 6px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--gold-2); }
.icon-btn:hover { border-color: var(--gold); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- layout ---------- */
.wrap { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 232px 1fr; gap: 24px; padding: 20px 16px 60px; }
nav.tabs { position: sticky; top: 92px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
nav.tabs button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
nav.tabs button:hover { background: var(--surface); color: var(--ink); }
nav.tabs button[aria-current="page"] { background: var(--surface-2); color: var(--gold-2); box-shadow: inset 3px 0 0 var(--gold); }
nav.tabs .badge { margin-left: auto; }
main { min-width: 0; }
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; padding-top: 0; gap: 12px; }
  nav.tabs { top: 74px; flex-direction: row; overflow-x: auto; margin: 0 -16px; padding: 8px 16px; background: var(--bg); z-index: 15; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { width: auto; white-space: nowrap; padding: 8px 12px; flex: none; }
  nav.tabs button[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--gold); }
  .brand img { width: 40px; height: 40px; }
  .brand-n { font-size: 28px; }
}

/* ---------- componentes ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 16px; }
.head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.head h1 .script { font-family: var(--font-script); font-weight: 400; color: var(--gold-2); font-size: 38px; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--gold); }
.btn.gold { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--on-gold); border-color: transparent; }
.btn.gold:hover { filter: brightness(1.06); }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn.bad { color: var(--bad); }
.btn.ghost { background: transparent; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.card h2 { font-size: 16px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.card h2 small { font-weight: 400; color: var(--muted); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--gold-deep), var(--gold-2), var(--gold-deep)); }
.kpi .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.kpi .v { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi .v.neg { color: var(--bad); }
@media (max-width: 600px) { .grid-cards { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi { padding: 12px; } .kpi .v { font-size: 21px; } .kpi .l { font-size: 10.5px; } }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar input, .toolbar select { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.toolbar input[type="search"] { flex: 1 1 220px; }
.toolbar .cnt { color: var(--muted); font-size: 13px; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.b-ok { background: var(--ok-bg); color: var(--ok); }
.b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); }
.b-info { background: var(--info-bg); color: var(--info); }
.b-gold { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold-2); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }
.empty b { color: var(--ink); display: block; font-size: 16px; margin-bottom: 4px; }
.note { border-left: 3px solid var(--gold); background: var(--surface-2); padding: 10px 14px; border-radius: 0 12px 12px 0; font-size: 13.5px; color: var(--muted); margin: 0 0 14px; }
.note b { color: var(--ink); }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-2)); border-radius: 99px; }

/* tabela que vira cartões no celular */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .acts { text-align: right; white-space: nowrap; }
.tbl .acts .btn { margin-left: 4px; }
.tbl .nm { font-weight: 600; }
.tbl .sub { font-size: 12.5px; color: var(--muted); }
.val-e { color: var(--ok); font-weight: 600; }
.val-s { color: var(--bad); font-weight: 600; }
@media (max-width: 720px) {
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl { background: transparent; border: 0; }
  .tbl thead { display: none; }
  .tbl tr { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; padding: 8px 4px; }
  .tbl td { border: 0; padding: 4px 12px; }
  .tbl td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .tbl .r, .tbl .acts { text-align: left; }
  .tbl .acts { padding-top: 8px; }
  .tbl .acts .btn { margin: 0 4px 4px 0; }
}

/* listas de pendências / obrigações */
.list { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; color: inherit; }
.alert:hover { border-color: var(--gold); }
.alert .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
.alert.alta .dot { background: var(--bad); }
.alert.media .dot { background: var(--warn); }
.alert.info .dot { background: var(--info); }
.ob { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.ob.feito { opacity: .7; }
.ob.feito .ob-t { text-decoration: line-through; text-decoration-color: var(--gold); }
.ob.na { opacity: .5; }
.ob-check { width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--gold); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--on-gold); }
.ob.feito .ob-check { background: var(--gold); }
.ob-t { font-weight: 600; }
.ob-d { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ob-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.ob-r { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
@media (max-width: 600px) { .ob { grid-template-columns: auto 1fr; } .ob-r { grid-column: 2; flex-direction: row; flex-wrap: wrap; align-items: center; } }
.mgroup { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold-2); font-weight: 700; }

/* relatórios */
.rep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.rep { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.rep h3 { font-size: 15px; }
.rep p { margin: 0; font-size: 13px; color: var(--muted); flex: 1; }
.rep .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rep input, .rep select { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }

/* formulário (janela) */
dialog#dlg { border: 1px solid var(--line); border-radius: 22px; padding: 0; background: var(--surface); color: var(--ink); width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: var(--shadow); }
dialog#dlg::backdrop { background: rgba(0, 0, 0, .65); }
.dlg-form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
.dlg-form header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dlg-form header h2 { font-size: 18px; flex: 1; }
.dlg-form header h2::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 10px; vertical-align: middle; }
.dlg-body { padding: 16px 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px 14px; }
.dlg-form footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.fld { grid-column: span 6; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.w3 { grid-column: span 3; } .fld.w2 { grid-column: span 2; } .fld.w4 { grid-column: span 4; }
@media (max-width: 600px) { .fld.w2, .fld.w3, .fld.w4 { grid-column: span 6; } dialog#dlg { width: 100vw; max-width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; margin: 0; } .dlg-form { max-height: 100vh; height: 100%; } .dlg-body { flex: 1; } }
.fld > label { font-size: 13px; font-weight: 600; color: var(--muted); }
.fld input:not([type="checkbox"]), .fld select, .fld textarea { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); }
.fld input:focus, .fld select:focus, .fld textarea:focus, .toolbar input:focus, .toolbar select:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
.fld textarea { min-height: 84px; resize: vertical; }
.fld small { color: var(--muted); font-size: 12px; }
.fsec { grid-column: span 6; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold-2); margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.fsec:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink) !important; font-weight: 500 !important; cursor: pointer; padding: 4px 0; }
.chk input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--gold); flex: none; }
.multi { display: flex; flex-wrap: wrap; gap: 6px; }
.multi label { display: inline-flex; gap: 6px; align-items: center; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; cursor: pointer; background: var(--surface-2); }
.multi label:has(input:checked) { border-color: var(--gold); color: var(--gold-2); background: color-mix(in srgb, var(--gold) 12%, var(--surface-2)); }
.multi input { accent-color: var(--gold); margin: 0; }
.filho { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 12px; margin-bottom: 10px; background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
.filho-h { grid-column: span 6; display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--gold-2); }
.pres { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; background: var(--surface-2); }
.pres label { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.pres label:last-child { border-bottom: 0; }
.pres input { accent-color: var(--gold); width: 18px; height: 18px; }

/* bloqueio */
#lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 24px; }
#lock .box { text-align: center; max-width: 340px; width: 100%; }
#lock img { width: 180px; height: 180px; border-radius: 50%; border: 3px solid var(--gold); background: #fff; }
#lock .brand-k { display: block; margin-top: 18px; }
#lock .brand-n { font-size: 56px; display: block; }
#lock input { width: 100%; margin: 16px 0 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: center; font-size: 22px; letter-spacing: .4em; }
#lock .err { color: var(--bad); min-height: 22px; font-size: 14px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--gold); color: var(--on-gold); padding: 10px 18px; border-radius: 999px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
footer.foot { max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 12px; text-align: center; }
footer.foot .lema { font-family: var(--font-script); font-size: 24px; color: var(--gold-2); display: block; margin-bottom: 4px; }

/* ---------- impressão / PDF ---------- */
#print { display: none; }
@media print {
  @page { size: A4; margin: 14mm 14mm 16mm; }
  html, body { background: #fff !important; color: #111 !important; }
  .top, .wrap, footer.foot, #toast, dialog, #lock { display: none !important; }
  #print { display: block; font: 10.5pt/1.45 var(--font-body); color: #111; }
  #print * { color: #111; }
}
#print .p-head { display: flex; align-items: center; gap: 14px; border-bottom: 2px solid #b8952f; padding-bottom: 10px; margin-bottom: 14px; }
#print .p-head img { width: 64px; height: 64px; }
#print .p-head .n { font-size: 9pt; letter-spacing: .3em; text-transform: uppercase; font-weight: 700; }
#print .p-head .s { font-family: var(--font-script); font-size: 26pt; line-height: .9; color: #8a6a14 !important; }
#print .p-head .d { font-size: 8.5pt; color: #444 !important; }
#print h1 { font-size: 15pt; text-align: center; margin: 6px 0 2px; text-transform: uppercase; letter-spacing: .04em; }
#print .p-sub { text-align: center; color: #444 !important; margin-bottom: 14px; }
#print h2 { font-size: 11.5pt; margin: 16px 0 6px; border-bottom: 1px solid #ccc; padding-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
#print table { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 9.5pt; page-break-inside: auto; }
#print tr { page-break-inside: avoid; }
#print th, #print td { border: 1px solid #999; padding: 4px 6px; text-align: left; vertical-align: top; }
#print th { background: #f3ecd9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 8.5pt; text-transform: uppercase; }
#print td.r, #print th.r { text-align: right; white-space: nowrap; }
#print tfoot td, #print tr.tot td { font-weight: 700; background: #faf6ea !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
#print .kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 18px; margin: 4px 0 8px; }
#print .kv div { border-bottom: 1px dotted #bbb; padding: 3px 0; }
#print .kv b { font-size: 8.5pt; text-transform: uppercase; color: #555 !important; margin-right: 6px; }
#print .kv .full { grid-column: span 2; }
#print p { margin: 6px 0; text-align: justify; }
#print .assin { display: flex; flex-wrap: wrap; gap: 30px 40px; margin-top: 46px; page-break-inside: avoid; }
#print .assin div { flex: 1 1 200px; border-top: 1px solid #111; text-align: center; padding-top: 4px; font-size: 9.5pt; }
#print .assin small { display: block; color: #555 !important; }
#print .p-foot { margin-top: 22px; font-size: 8pt; color: #666 !important; border-top: 1px solid #ddd; padding-top: 6px; display: flex; justify-content: space-between; }
#print .brk { page-break-before: always; }
#print .linhas div { border-bottom: 1px solid #aaa; height: 22px; }
#print .corte { border-top: 1px dashed #777; margin: 26px 0 22px; text-align: center; font-size: 8pt; color: #777 !important; }
#print .recibo { border: 1.5px solid #b8952f; padding: 14px 18px; border-radius: 6px; }
#print .recibo .val { float: right; font-size: 14pt; font-weight: 700; border: 1px solid #111; padding: 2px 10px; }
#print .ck { display: inline-block; width: 11px; height: 11px; border: 1px solid #111; margin-right: 5px; vertical-align: -1px; text-align: center; font-size: 8pt; line-height: 10px; }
#print .mini { font-size: 8.5pt; color: #444 !important; }
</style>
</head>
<body>
<div id="lock" hidden>
  <div class="box">
    <img src="icons/logo.png" alt="Instituto Luma">
    <span class="brand-k">Instituto</span><span class="brand-n">Luma</span>
    <form id="lock-form">
      <input id="lock-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" aria-label="Senha de acesso">
      <div class="err" id="lock-err"></div>
      <button class="btn gold" style="width:100%;justify-content:center">Entrar</button>
    </form>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#painel">
      <img src="icons/logo.png" alt="">
      <span class="brand-txt"><span class="brand-k">Instituto</span><span class="brand-n">Luma</span><span class="brand-s">Luz para mães atípicas · Gestão</span></span>
    </a>
    <div class="top-act">
      <button class="icon-btn" id="btn-tema" title="Tema claro/escuro" aria-label="Tema claro ou escuro"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="icon-btn" id="btn-lock" title="Bloquear" aria-label="Bloquear" hidden><svg class="i" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  <main id="main"></main>
</div>
<footer class="foot">
  <span class="lema">Luz que acolhe, orienta e ilumina</span>
  Os dados ficam só neste aparelho. Baixe a cópia de segurança todo mês (Configurações).
</footer>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<div id="print"></div>

<script src="obrigacoes.js"></script>
<script src="app.js"></script>
</body>
</html>
