# Cópia de segurança automática do aplicativo.
# A cada atualização na versão principal (main), guarda um .zip com todos os arquivos
# em "Releases" do repositório. As cópias antigas nunca são apagadas.
# Também dá para rodar à mão: aba Actions > Cópia de segurança > Run workflow.
name: Cópia de segurança

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar o arquivo .zip
        run: |
          DATA=$(TZ=America/Manaus date +%Y-%m-%d_%H%M)
          CURTO=$(git rev-parse --short HEAD)
          echo "TAG=copia-${DATA}-${CURTO}" >> "$GITHUB_ENV"
          echo "DATA=${DATA}" >> "$GITHUB_ENV"
          git archive --format=zip --prefix=agenda-psi/ -o "agenda-psi-${DATA}.zip" HEAD
      - name: Guardar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "agenda-psi-${DATA}.zip" \
            --title "Cópia de segurança ${DATA}" \
            --notes "Cópia automática de todos os arquivos do aplicativo (versão ${GITHUB_SHA}). Para restaurar, baixe o .zip e envie os arquivos para o repositório." \
            --target "$GITHUB_SHA"
