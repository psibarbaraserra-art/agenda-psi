<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Cadastro | Psi Bárbara Serra</title>
<style>
:root { --bg: #fbf0ec; --surface: #fff8f6; --line: #e7cfcb; --ink: #2b2325; --muted: #7d6d70; --wine: #8a2f45; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #1d1618; --surface: #281e20; --line: #4a3a3d; --ink: #f4e9e7; --muted: #bda9ac; --wine: #eaa3b2; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 32px 16px; }
.box { max-width: 520px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
h1 { margin: 0 0 8px; font: 600 26px/1.2 Georgia, serif; color: var(--wine); }
p { margin: 0 0 10px; }
.m { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<div class="box">
  <h1>Cadastro</h1>
  <p>O cadastro agora é feito diretamente com a psicóloga, de forma reservada, no início do atendimento.</p>
  <p>Não é preciso preencher nada por aqui. Se tiver dúvidas, fale pelo WhatsApp.</p>
  <p class="m">Bárbara Serra Oliveira · Psicóloga · CRP 20/13.134</p>
</div>
</body>
