<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Confirmar sessão | Psi Bárbara Serra</title>
<style>
:root { --bg: #fbf0ec; --surface: #fff8f6; --line: #e7cfcb; --ink: #2b2325; --muted: #7d6d70; --wine: #8a2f45; --on-wine: #fff8f6; --ok: #4f7a52; --ok-bg: #e4efe2; --warn: #9a4a2f; --warn-bg: #f7e3d7; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #1d1618; --surface: #281e20; --line: #4a3a3d; --ink: #f4e9e7; --muted: #bda9ac; --wine: #eaa3b2; --on-wine: #2b1519; --ok: #9cc79f; --ok-bg: #22342a; --warn: #eab199; --warn-bg: #3a2620; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 32px 16px; }
.box { max-width: 480px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 14px; }
h1 { margin: 0; font: 600 26px/1.2 Georgia, serif; color: var(--wine); }
p { margin: 0; }
.quando { font: 600 22px/1.3 Georgia, serif; }
.m { color: var(--muted); font-size: 13px; }
button { font: inherit; border-radius: 999px; padding: 12px 16px; cursor: pointer; width: 100%; font-weight: 600; }
.cta { background: var(--wine); color: var(--on-wine); border: 0; }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.danger { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
button[disabled] { opacity: .6; cursor: default; }
.aviso { border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.aviso.ok { background: var(--ok-bg); color: var(--ok); }
.aviso.no { background: var(--warn-bg); color: var(--warn); }
.acoes { display: grid; gap: 8px; }
</style>
</head>
<body>
<main class="box" id="app" aria-live="polite"><p class="m">Carregando…</p></main>
<script src="../config.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var ASSINA = '<p class="m">Bárbara Serra Oliveira · Psicóloga · CRP 20/13.134</p>';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pinta(h) { app.innerHTML = h + ASSINA; }

  // Os dados do horário vêm depois do # do link e não são enviados a nenhum servidor.
  var d = null;
  try {
    var b = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    d = JSON.parse(decodeURIComponent(escape(atob(b))));
  } catch (e) { d = null; }
  if (!d || !/^[A-Za-z0-9]{12,40}$/.test(d.t || '') || !/^\d{4}-\d{2}-\d{2}$/.test(d.d || '') || !/^\d{2}:\d{2}$/.test(d.h || '')) {
    pinta('<h1>Link incompleto</h1><p>Não foi possível ler este link. Abra de novo pela mensagem que você recebeu ou fale com a psicóloga pelo WhatsApp.</p>');
    return;
  }
  var p = d.d.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
  var dia = dt.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  dia = dia.charAt(0).toUpperCase() + dia.slice(1);
  var hp = d.h.split(':'), inicio = new Date(+p[0], +p[1] - 1, +p[2], +hp[0], +hp[1]);
  var passou = inicio < new Date();
  var CHAVE = 'conf-resp-' + d.t;
  var ja = null; try { ja = localStorage.getItem(CHAVE); } catch (e) {}
  var ep = (window.AGENDA_CFG || {}).endpoint;

  function resumo() {
    return '<h1>Olá' + (d.n ? ', ' + esc(d.n) : '') + '.</h1>' +
      '<p>Sua sessão com a psicóloga Bárbara Serra está marcada para:</p>' +
      '<p class="quando">' + esc(dia) + '<br>às ' + esc(d.h) + '</p>' +
      '<p class="m">' + esc(String(d.m || 'Presencial').toLowerCase() === 'online' ? 'Atendimento on-line' : 'Atendimento presencial') + '</p>';
  }
  function final(r) {
    pinta(resumo() + (r === 'sim'
      ? '<div class="aviso ok"><b>Presença confirmada.</b> Obrigada! Até lá.</div>'
      : '<div class="aviso no"><b>Pedido de desmarcação enviado.</b> A psicóloga vai ver o seu aviso. Para combinar um novo horário, fale com ela pelo WhatsApp.</div>') +
      '<button type="button" class="ghost" id="mudar">Mudei de ideia</button>');
    document.getElementById('mudar').onclick = function () { ja = null; tela(); };
  }
  function enviar(r, btn) {
    if (!ep) { alert('Não foi possível enviar agora. Fale com a psicóloga pelo WhatsApp.'); return; }
    btn.disabled = true;
    fetch(ep, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ conf: d.t, r: r }) })
      .then(function (x) { return x.json(); })
      .then(function (o) {
        if (!o || !o.ok) throw new Error('falha');
        try { localStorage.setItem(CHAVE, r); } catch (e) {}
        ja = r; final(r);
      })
      .catch(function () { btn.disabled = false; alert('Não foi possível enviar agora. Confira a internet e tente de novo, ou fale com a psicóloga pelo WhatsApp.'); });
  }
  function desmarcar() {
    pinta(resumo() + '<p><b>Tem certeza de que precisa desmarcar?</b> A psicóloga será avisada pela agenda.</p>' +
      '<div class="acoes"><button type="button" class="danger" id="sim">Sim, preciso desmarcar</button><button type="button" class="ghost" id="volta">Voltar</button></div>');
    document.getElementById('sim').onclick = function () { enviar('nao', this); };
    document.getElementById('volta').onclick = tela;
  }
  function tela() {
    if (passou) { pinta(resumo() + '<div class="aviso no">Este horário já passou. Se precisar, fale com a psicóloga pelo WhatsApp.</div>'); return; }
    if (ja === 'sim' || ja === 'nao') { final(ja); return; }
    pinta(resumo() + '<div class="acoes"><button type="button" class="cta" id="ok">Confirmar presença</button><button type="button" class="ghost" id="nao">Preciso desmarcar</button></div>' +
      '<p class="m">Esta página não pede nenhum dado seu. Ela só avisa a psicóloga da sua resposta.</p>');
    document.getElementById('ok').onclick = function () { enviar('sim', this); };
    document.getElementById('nao').onclick = desmarcar;
  }
  tela();
})();
</script>
</body>
</html>
